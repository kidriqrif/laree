name: Keep the database awake

# A free Supabase project pauses after 7 days without requests. One tiny call a day prevents that.
on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call ping()
        run: |
          curl --fail --silent --show-error -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -d '{}'
        env:
          # Both are public: the app ships them. Repository variables override them.
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://lqxvjonypveaxsmcgbql.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_epuJ5T4ZJRv0aD_zY-5aPg_bMqmazBE' }}
