name: Checks

on:
  pull_request:
  push:
    branches: [agent-staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:manifest
      - run: npm run check:base
      - run: npm run check:budget
      # The live build must also stay inside the Today budget.
      - name: Live build budget
        run: npx vite build --outDir dist-live && node scripts/check-budget.ts dist-live --live
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # The database, the API and the file storage: the timeout and backup checks below use them.
      - name: Start the database and the API
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor,realtime,postgres-meta,edge-runtime
      - name: Access-rule tests
        run: supabase test db
      # The sync relies on the API cancelling a statement after 8 seconds (src/live/sync).
      - name: API statement timeout
        run: node scripts/check-api-timeout.ts
      # The nightly backup and the restore, against this stack: rows and files that match, and
      # no secret key sent to an address it must not reach.
      - name: Backup and restore
        run: bash scripts/check-backup.sh
      - name: Schema lint
        run: supabase db lint --level warning --fail-on error
