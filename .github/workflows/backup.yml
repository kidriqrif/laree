name: Nightly backup

# The free plan has no backups. Every night this dumps the data and downloads the original activity
# files, encrypts both to the owner's age public key (only the owner can read them) and keeps the
# result as an artifact for 7 days. The schema is not dumped: the migrations in this repository
# are the schema. Restore steps: docs/dev/runbook.md.
on:
  schedule:
    - cron: '41 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    environment: production
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # No default: the URL must name the same project as SUPABASE_DB_URL, or the files come from another bucket.
      # Neither the URL nor the age public key is secret, so each is read from a variable or a secret.
      SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT || secrets.BACKUP_AGE_RECIPIENT }}
    steps:
      # Nothing set: backups are not wanted here, so skip. Some set: a backup was wanted and
      # would be missed without a word, so fail and name what is missing.
      - name: Skip unless configured
        id: ready
        run: |
          missing=()
          [ -n "$DB_URL" ] || missing+=('SUPABASE_DB_URL (secret)')
          [ -n "$SUPABASE_URL" ] || missing+=('SUPABASE_URL')
          [ -n "$SUPABASE_SECRET_KEY" ] || missing+=('SUPABASE_SECRET_KEY (secret)')
          [ -n "$AGE_RECIPIENT" ] || missing+=('BACKUP_AGE_RECIPIENT')
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif [ "${#missing[@]}" -eq 4 ]; then
            echo "::warning::Backup skipped: set SUPABASE_DB_URL, SUPABASE_URL, SUPABASE_SECRET_KEY and BACKUP_AGE_RECIPIENT (docs/dev/runbook.md)."
          else
            list=$(printf '%s, ' "${missing[@]}")
            echo "::error::No backup: GitHub has no value for ${list%, } (docs/dev/runbook.md)."
            exit 1
          fi
      - uses: actions/checkout@v7
        if: steps.ready.outputs.go == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.ready.outputs.go == 'true'
        with:
          version: 3.1.0
      - name: Dump
        if: steps.ready.outputs.go == 'true'
        run: |
          # Rows only, of the app's tables and the accounts, and the files that match them. The
          # files' rows in the storage schema are left out: uploading the files again on restore
          # recreates them.
          scripts/backup.sh dump
          sudo apt-get install -y age >/dev/null
          tar -czf - dump | age -r "$AGE_RECIPIENT" -o "laree-$(date -u +%F).tar.gz.age"
          rm -rf dump
      - uses: actions/upload-artifact@v4
        if: steps.ready.outputs.go == 'true'
        with:
          name: laree-backup
          path: laree-*.tar.gz.age
          retention-days: 7
